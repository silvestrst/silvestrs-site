# Open-source contributions shown on the home page, in display order.
# Fields:
#   project   name shown as the card title
#   url       project website, or the GitHub repo when there is no website
#   tier      "major" renders a full card; "minor" renders a row in the single
#             "Other contributions" card (name, chip, tags only)
#   stat      text of the chip, e.g. "106 merged PRs"
#   stat_url  where the chip links: my merged PRs / commit / PR on GitHub
#   stat_label  accessible description of the chip link
#   summary   one or two sentences about what I did (major only)
#   tech      tags shown on the card
- project: OpenTitan
  url: https://www.opentitan.org
  tier: major
  stat: 106 merged PRs
  stat_url: https://github.com/lowRISC/opentitan/pulls?q=is%3Apr+author%3Asilvestrst+is%3Amerged
  stat_label: 106 merged pull requests to OpenTitan on GitHub
  summary: >-
    The open-source silicon root of trust. Device drivers for UART, PLIC, AES, the always-on
    timer, Reset Manager, Pinmux and SRAM Controller; Mask ROM and ROM_EXT secure-boot code;
    a Rust ROM_EXT image signer; a RISC-V PMP library; and chip-level SRAM and HMAC tests.
  tech: ["C", "Rust", "RISC-V"]

