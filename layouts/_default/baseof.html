<!DOCTYPE html>
<html lang="{{ site.LanguageCode }}" data-theme="kanagawa">
{{ partial "head.html" . }}
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    {{ partial "header.html" . }}
    <main id="main" class="wrap site-main">
      {{ block "main" . }}{{ end }}
    </main>
  </div>
  {{ partial "footer.html" . }}
  {{ with resources.Get "js/theme.js" | fingerprint }}<script src="{{ .RelPermalink }}" defer></script>{{ end }}
</body>
</html>
