<footer class="site-footer">
  <div class="wrap">
    <ul class="contact" aria-label="Contact">
      <li>
        <a class="badge-btn" href="mailto:{{ site.Params.email }}" title="{{ site.Params.email }}" aria-label="Email {{ site.Params.name }} at {{ site.Params.email }}">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <span>Mail</span>
        </a>
      </li>
      <li>
        <a class="badge-btn" href="https://github.com/{{ site.Params.github }}" rel="me noopener" title="github.com/{{ site.Params.github }}" aria-label="GitHub profile of {{ site.Params.name }}">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
          <span>GitHub</span>
        </a>
      </li>
    </ul>
    <div class="footer-meta">
      <label class="theme-picker">
        <span>Theme</span>
        <select id="theme-select" name="theme"></select>
      </label>
      <p class="copyright">© {{ now.Year }} {{ site.Params.name }}</p>
    </div>
  </div>
</footer>
