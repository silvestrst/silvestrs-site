<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta name="author" content="{{ site.Params.name }}">
  <link rel="canonical" href="{{ .Permalink }}">
  {{- with partial "avatar-image.html" . }}
  {{- $fav := .Fill "64x64 Center png" }}
  <link rel="icon" href="{{ $fav.RelPermalink }}" type="image/png">
  {{- else }}
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  {{- end }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <script>
    /* Apply the saved theme before first paint so there is no flash of the wrong palette. */
    (function () {
      var d = document.documentElement, t = "kanagawa";
      d.classList.add("js");
      try {
        var s = localStorage.getItem("theme");
        if (s && /^(kanagawa|catppuccin|gruvbox|rose-pine|tokyo-night|nord|amber|paper)$/.test(s)) t = s;
      } catch (e) {}
      d.setAttribute("data-theme", t);
    })();
  </script>
</head>
