<header class="site-header">
  <div class="identity">
    {{ if .IsHome }}
    <h1 class="site-name">{{ site.Params.name }}</h1>
    {{ else }}
    <p class="site-name"><a href="{{ site.Home.RelPermalink }}">{{ site.Params.name }}</a></p>
    {{ end }}
    <p class="tagline">{{ site.Params.tagline }}</p>
  </div>
  <nav class="site-nav" aria-label="Main">
    {{ range site.Menus.main }}
    <a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
